<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mentawai Indah: villas and fast boat booking (prototype)</title>
<link rel="icon" href="/assets/resort-mark.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F8F7; --surface:#FFFFFF; --surface-2:#E7F3F1; --sand:#F3ECDF; --sand-ink:#7A6440;
  --ink:#12293A; --ink-2:#4B6371; --ink-3:#7D919B; --line:#D3E5E2;
  --lagoon:#17807E; --lagoon-ink:#0E5F5D; --lagoon-hover:#126C6A; --shallow:#CDEAE5;
  --gold:#A47B2C; --gold-soft:#F4E7CC;
  --danger:#B94A3A; --danger-soft:#F8E1DC; --ok:#2B7A4B; --ok-soft:#DDF0E3; --warn:#9A6512; --warn-soft:#F8EBCF;
  --sky1:#D3EEF2; --sky2:#F2FAF8; --sea1:#9AD8D0; --sea2:#3AA49E; --land:#2F6A57; --land-2:#4C8770;
  --shadow:0 1px 2px rgba(18,41,58,.06),0 8px 24px rgba(18,41,58,.07);
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1C24; --surface:#122833; --surface-2:#173240; --sand:#1F2F31; --sand-ink:#D9C49B;
    --ink:#E4F0EE; --ink-2:#A5BEC4; --ink-3:#7E979F; --line:#234250;
    --lagoon:#3FB0AA; --lagoon-ink:#8AD9D3; --lagoon-hover:#52C1BB; --shallow:#1C4747;
    --gold:#D8B46A; --gold-soft:#3A3220;
    --danger:#E8806F; --danger-soft:#3B2420; --ok:#6CC88F; --ok-soft:#1B3527; --warn:#E3B25E; --warn-soft:#3A2F17;
    --sky1:#16323F; --sky2:#0F2430; --sea1:#1F5A5E; --sea2:#123E46; --land:#21463C; --land-2:#2C5A4B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1C24; --surface:#122833; --surface-2:#173240; --sand:#1F2F31; --sand-ink:#D9C49B;
  --ink:#E4F0EE; --ink-2:#A5BEC4; --ink-3:#7E979F; --line:#234250;
  --lagoon:#3FB0AA; --lagoon-ink:#8AD9D3; --lagoon-hover:#52C1BB; --shallow:#1C4747;
  --gold:#D8B46A; --gold-soft:#3A3220;
  --danger:#E8806F; --danger-soft:#3B2420; --ok:#6CC88F; --ok-soft:#1B3527; --warn:#E3B25E; --warn-soft:#3A2F17;
  --sky1:#16323F; --sky2:#0F2430; --sea1:#1F5A5E; --sea2:#123E46; --land:#21463C; --land-2:#2C5A4B;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--lagoon);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;letter-spacing:-.005em}
h1{font-size:clamp(2rem,4.6vw,3.4rem)}
h2{font-size:clamp(1.5rem,2.6vw,2rem)}
h3{font-size:1.25rem}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.tiny{font-size:.78rem}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.stack>*+*{margin-top:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:11px 20px;font-weight:600;font-size:.95rem;background:var(--lagoon);color:#fff;transition:background .15s}
.btn:hover{background:var(--lagoon-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-soft{background:var(--shallow);color:var(--lagoon-ink)}
.btn-soft:hover{background:var(--surface-2)}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-sm{padding:7px 14px;font-size:.85rem}
.btn-block{width:100%}
.link{background:none;border:0;padding:0;color:var(--lagoon-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* fields */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.8rem;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px}
input.input,select.input{height:46px}
.input:focus{outline:none;border-color:var(--lagoon);box-shadow:0 0 0 3px var(--shallow)}
.err{color:var(--danger);font-size:.85rem;font-weight:600}

/* pills/badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-danger{background:var(--danger-soft);color:var(--danger)}
.b-info{background:var(--shallow);color:var(--lagoon-ink)}
.b-gold{background:var(--gold-soft);color:var(--gold)}
.b-plain{background:var(--surface-2);color:var(--ink-2)}

/* ============ CUSTOMER SITE ============ */
.site-head{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head-in{display:flex;align-items:center;gap:20px;min-height:66px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;text-align:left}
.brand img{width:46px;height:auto}
.brand b{display:block;font-family:var(--display);font-weight:400;font-size:1.2rem;line-height:1.1}
.brand small{display:block;color:var(--ink-2);font-size:.75rem}
.main-nav{display:flex;gap:4px;flex:1}
.main-nav button{background:none;border:0;padding:9px 14px;border-radius:999px;font-weight:600;color:var(--ink-2)}
.main-nav button:hover{background:var(--surface-2);color:var(--ink)}
.main-nav button.on{background:var(--shallow);color:var(--lagoon-ink)}
.head-tools{display:flex;align-items:center;gap:8px}
.cur select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 10px;font-weight:600;font-size:.85rem}
@media (max-width:760px){
  .head-in{gap:6px;padding-top:8px;padding-bottom:8px}
  .main-nav{order:3;flex-basis:100%;overflow-x:auto}
  .head-tools{margin-left:auto}
  .site-head .brand small{display:none}
}

.hero{position:relative;height:clamp(440px,64vh,580px);overflow:hidden;border-bottom:1px solid var(--line)}
.hero svg.horizon{position:absolute;inset:0;width:100%;height:100%}
.hero-copy{position:relative;z-index:2;padding-top:clamp(28px,6vh,64px)}
.hero-copy h1{max-width:22ch;font-size:clamp(1.9rem,3.6vw,3rem)}
.hero-copy p{max-width:46ch;margin-top:14px;color:var(--ink-2);font-size:1.05rem}
.searchbox{position:relative;z-index:5;margin-top:-104px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:6px 6px 18px}
.tabs{display:flex;gap:4px;padding:4px;border-bottom:1px solid var(--line);margin:0 4px 16px}
.tab{display:flex;align-items:center;gap:8px;background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px 10px;font-weight:700;color:var(--ink-2)}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{color:var(--lagoon-ink);border-bottom-color:var(--lagoon)}
.sgrid{display:grid;gap:12px;padding:0 14px;align-items:end}
.sgrid.v{grid-template-columns:1.4fr 1fr 1fr .8fr auto}
.sgrid.b{grid-template-columns:1fr auto 1fr 1fr 1fr .8fr auto}
.swap{width:40px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center}
.trip-toggle{display:flex;gap:6px;padding:0 14px 12px}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85rem;color:var(--ink-2)}
.seg[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
@media (max-width:900px){
  .sgrid.v{grid-template-columns:1fr 1fr}
  .sgrid.v .field:first-child{grid-column:1/-1}
  .sgrid.b{grid-template-columns:1fr auto 1fr}
  .sgrid .btn{grid-column:1/-1}
}

section.band{padding:64px 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.sec-head p{max-width:52ch}
.villa-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media (max-width:900px){.villa-cards{grid-template-columns:1fr}}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.vcard:hover .scene{transform:scale(1.02)}
.vcard .pic{aspect-ratio:16/10;overflow:hidden;background:var(--surface-2)}
.scene{display:block;width:100%;height:100%;transition:transform .4s}
.vcard .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.vcard .foot{display:flex;justify-content:space-between;align-items:end;margin-top:auto;padding-top:10px}
.price{font-weight:700;font-size:1.15rem;color:var(--ink)}
.price small{font-weight:500;font-size:.8rem;color:var(--ink-2)}

.boatband{background:var(--sand);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.boatband .inner{display:grid;grid-template-columns:200px 1fr;gap:40px;align-items:center}
.boat-badge{width:200px;height:200px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow)}
.boat-badge img{width:88%}
.routes-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:20px}
.route-tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.route-tile:hover{border-color:var(--lagoon)}
@media (max-width:760px){.boatband .inner{grid-template-columns:1fr;justify-items:start}.boat-badge{width:130px;height:130px}}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;counter-reset:s}
.steps li{list-style:none;border-top:2px solid var(--lagoon);padding-top:14px}
.steps li b{display:block;font-family:var(--display);font-weight:400;font-size:1.2rem;margin-bottom:4px}
.steps li b::before{counter-increment:s;content:counter(s) ". ";color:var(--lagoon)}
.steps{padding:0;margin:0}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

footer.site-foot{border-top:1px solid var(--line);padding:40px 0 48px;margin-top:20px}
.foot-grid{display:grid;grid-template-columns:auto 1fr auto;gap:32px;align-items:center}
.foot-logo{background:#F7F7F7;border-radius:16px;padding:14px 18px}
.foot-logo img{width:170px;display:block}
.foot-boat{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center}
.foot-boat img{width:90%}
@media (max-width:760px){.foot-grid{grid-template-columns:1fr}}

/* list pages */
.page{padding:28px 0 64px}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--ink-2);font-size:.88rem;margin-bottom:14px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;color:var(--lagoon-ink);font-weight:600}
.strip{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:24px}
.result{display:grid;grid-template-columns:280px 1fr auto;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px}
.result .pic{min-height:190px}
.result .mid{padding:18px 0;display:flex;flex-direction:column;gap:8px}
.result .end{padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;text-align:right;border-left:1px dashed var(--line);min-width:190px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
@media (max-width:820px){.result{grid-template-columns:1fr}.result .mid{padding:0 18px}.result .end{border-left:0;border-top:1px dashed var(--line);align-items:stretch;text-align:left}}

.detail{display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start}
.gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:8px;border-radius:20px;overflow:hidden;height:360px;margin-bottom:24px}
.gallery>div:first-child{grid-row:1/3}
.gallery>div{overflow:hidden;background:var(--surface-2)}
.room{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:10px}
.room .pic{height:100px;border-radius:10px;overflow:hidden}
.room.sel{border-color:var(--lagoon);box-shadow:0 0 0 2px var(--shallow)}
.room.off{opacity:.55}
.summary{position:sticky;top:90px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:.93rem}
.sum-total{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-weight:700;font-size:1.05rem}
@media (max-width:900px){.detail{grid-template-columns:1fr}.summary{position:static}.gallery{height:240px}.room{grid-template-columns:96px 1fr}.room>.r-end{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}}

.datestrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.dchip{flex:0 0 auto;min-width:104px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;text-align:left}
.dchip b{display:block;font-size:.88rem}
.dchip span{font-size:.8rem;color:var(--ink-2)}
.dchip.on{border-color:var(--lagoon);background:var(--shallow)}
.dchip.on span{color:var(--lagoon-ink)}
.dep{display:grid;grid-template-columns:1fr auto;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:12px;align-items:center}
.dep-times{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.dep-times .t{font-size:1.45rem;font-weight:700;line-height:1}
.dep-line{position:relative;height:2px;background:repeating-linear-gradient(90deg,var(--lagoon) 0 6px,transparent 6px 11px);margin-top:4px}
.dep-line span{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:.78rem;color:var(--ink-2);white-space:nowrap;background:var(--surface);padding:0 6px}
.dep-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.dep-end{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;min-width:150px}
@media (max-width:700px){.dep{grid-template-columns:1fr}.dep-end{align-items:stretch;text-align:left}}

.legbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.leg{padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:.88rem}
.leg.on{border-color:var(--lagoon);background:var(--shallow);color:var(--lagoon-ink);font-weight:600}
.leg.done{color:var(--ok)}

/* seat map */
.hull{background:var(--surface);border:1px solid var(--line);border-radius:120px 120px 28px 28px;padding:70px 26px 26px;max-width:340px;margin:0 auto;position:relative}
.hull::before{content:"Bow";position:absolute;top:28px;left:50%;transform:translateX(-50%);font-size:.78rem;color:var(--ink-3)}
.helm{display:flex;justify-content:flex-end;margin-bottom:12px;font-size:.75rem;color:var(--ink-3)}
.seatrow{display:grid;grid-template-columns:repeat(2,44px) 30px repeat(2,44px);gap:8px;justify-content:center;margin-bottom:8px;align-items:center}
.seatrow .rn{text-align:center;font-size:.75rem;color:var(--ink-3)}
.seat{height:42px;border-radius:10px 10px 6px 6px;border:1.5px solid var(--lagoon);background:var(--surface);font-size:.75rem;font-weight:700;color:var(--lagoon-ink)}
.seat:hover:not(:disabled){background:var(--shallow)}
.seat.on{background:var(--lagoon);color:#fff}
.seat.on,.seat.on:hover{background:var(--lagoon);color:#fff}
.seat:disabled{border-color:var(--line);background:var(--surface-2);color:var(--ink-3);cursor:not-allowed}
.legend{display:flex;gap:16px;justify-content:center;font-size:.8rem;color:var(--ink-2);margin-top:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1.5px solid var(--lagoon)}
.legend i.t{background:var(--surface-2);border-color:var(--line)}
.legend i.s{background:var(--lagoon)}

/* checkout */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px}
.panel h3{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.pax{border-top:1px dashed var(--line);padding-top:14px;margin-top:14px}
.pay-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pay-opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.pay-opt:has(input:checked){border-color:var(--lagoon);background:var(--shallow)}
.pay-opt input{margin-top:4px;accent-color:var(--lagoon)}
.pay-opt b{display:block;font-size:.95rem}
@media (max-width:640px){.pay-opts{grid-template-columns:1fr}}

/* voucher */
.voucher{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;max-width:760px;margin:0 auto}
.voucher-top{background:linear-gradient(180deg,var(--sky1),var(--sky2));padding:26px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:2px dashed var(--line)}
.voucher-body{display:grid;grid-template-columns:1fr 150px;gap:24px;padding:24px}
.qr{width:150px;height:150px;background:#fff;padding:8px;border-radius:10px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:.93rem}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:600}
@media (max-width:640px){.voucher-body{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}}
.crosssell{max-width:760px;margin:22px auto 0;background:var(--sand);border-radius:20px;padding:20px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.crosssell .boat-mini{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:0 0 auto}
.crosssell .boat-mini img{width:90%}

.empty{text-align:center;padding:48px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:18px}
.empty p{margin:6px auto 16px;max-width:44ch;color:var(--ink-2)}

/* modal / drawer / toast */
.scrim{position:fixed;inset:0;background:rgba(10,25,33,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:22px;width:min(560px,100%);max-height:calc(100% - 24px);overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(820px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:16px}
.x{background:var(--surface-2);border:0;width:36px;height:36px;border-radius:50%;font-size:1.2rem;line-height:1}
.drawer-scrim{justify-content:flex-end;padding:0}
.drawer{background:var(--surface);height:100%;width:min(480px,100%);overflow:auto;padding:24px;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;z-index:100;box-shadow:var(--shadow);font-size:.92rem}
.login-tabs{display:flex;gap:6px;margin-bottom:16px}
.demo-box{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:.85rem;margin-top:16px}

/* ============ ADMIN ============ */
.admin{display:grid;grid-template-columns:240px 1fr;min-height:100%;height:100%}
html,body{height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
.side .brand{padding:4px 8px 16px}
.side .brand img{width:38px}
.side .brand b{font-size:1.05rem}
.side-nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--ink-2)}
.side-nav button svg{width:18px;height:18px;flex:0 0 auto}
.side-nav button:hover{background:var(--surface-2);color:var(--ink)}
.side-nav button.on{background:var(--shallow);color:var(--lagoon-ink)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.admin>div{min-width:0}
.main{min-width:0;padding:24px 28px 60px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:1.85rem}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.kpi .v{font-size:1.6rem;font-weight:700;margin-top:4px;line-height:1.2}
.kpi .s{font-size:.82rem;color:var(--ink-2);margin-top:2px}
.cards2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.card-head h3{font-size:1.1rem}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:.8rem;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
.load{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:90px}
.load i{display:block;height:100%;background:var(--lagoon);border-radius:99px}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.filters .input{min-height:40px;padding:8px 12px}
.segbar{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px}
.segbar button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--ink-2)}
.segbar button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.cal{border-collapse:separate;border-spacing:0}
.cal th,.cal td{padding:0;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.cal th{padding:8px 4px;font-size:.75rem;min-width:46px}
.cal th.wk{color:var(--gold)}
.cal th.today{background:var(--shallow);color:var(--lagoon-ink)}
.cal .rname{position:sticky;left:0;background:var(--surface);text-align:left;padding:8px 12px;min-width:200px;z-index:1;font-size:.86rem}
.cal .vrow td{background:var(--sand);text-align:left;padding:8px 12px;font-weight:700;font-size:.85rem;position:sticky;left:0}
.cell{width:100%;height:38px;border:0;background:transparent;font-size:.68rem;font-weight:700;padding:0 2px;overflow:hidden;white-space:nowrap}
.cell:hover{background:var(--surface-2)}
.cell.bk{background:var(--lagoon);color:#fff}
.cell.bk.pend{background:var(--gold);color:#fff}
.cell.blk{background:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,var(--line) 5px 9px);color:var(--ink-2)}
.cal-legend{display:flex;gap:16px;font-size:.82rem;color:var(--ink-2);margin-top:12px;flex-wrap:wrap}
.cal-legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.switch{position:relative;display:inline-block;width:40px;height:22px}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.switch span::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--lagoon)}
.switch input:checked+span::before{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2.5px solid var(--lagoon);outline-offset:2px}
.num-in{width:96px;min-height:36px;padding:6px 10px}
.villa-block{margin-bottom:22px}
.villa-block .vb-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.timeline{border-left:2px solid var(--line);padding-left:14px;margin-left:4px}
.timeline div{position:relative;padding-bottom:10px;font-size:.88rem}
.timeline div::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--lagoon)}
.mobile-adminbar{display:none}
@media (max-width:980px){.kpis{grid-template-columns:1fr 1fr}.cards2{grid-template-columns:1fr}}
@media (max-width:820px){
  .admin{grid-template-columns:1fr}
  .side{display:none}
  .mobile-adminbar{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .mobile-adminbar button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.85rem;color:var(--ink-2)}
  .mobile-adminbar button.on{background:var(--shallow);color:var(--lagoon-ink);border-color:transparent}
  .main{padding:18px 14px 50px}
}
/* ============ CHAT WIDGET ============ */
.chat-fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:10px 18px 10px 10px;background:var(--lagoon);color:#fff;font-weight:700;box-shadow:0 6px 24px rgba(18,41,58,.22)}
.chat-fab:hover{background:var(--lagoon-hover)}
.chat-fab .av{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center}
.chat-fab .av img{width:26px}
.chat-panel{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:61;width:min(390px,calc(100vw - 24px));height:min(620px,calc(100dvh - 110px));background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(18,41,58,.22);display:flex;flex-direction:column;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:12px;padding:14px 14px 12px 16px;background:linear-gradient(180deg,var(--sky1),var(--surface));border-bottom:1px solid var(--line)}
.chat-head .av{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;border:1px solid var(--line);flex:0 0 auto}
.chat-head .av img{width:30px}
.chat-head b{display:block;font-family:var(--display);font-weight:400;font-size:1.08rem;line-height:1.2}
.chat-head small{color:var(--ink-2);font-size:.78rem}
.chat-head .x{margin-left:auto;flex:0 0 auto}
.chat-log{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:.92rem;line-height:1.45;overflow-wrap:anywhere}
.msg.bot{background:var(--surface-2);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--lagoon);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.msg p+p,.msg ul+p,.msg p+ul{margin-top:6px}
.msg ul{margin:4px 0 0;padding-left:18px}
.msg .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.msg .acts button{border:1px solid var(--lagoon);background:var(--surface);color:var(--lagoon-ink);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:700}
.msg .acts button:hover{background:var(--shallow)}
.msg.note{background:var(--gold-soft);color:var(--ink);font-size:.8rem;align-self:stretch;max-width:100%;border-radius:12px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chat-sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chat-sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;color:var(--ink-2);font-weight:600;text-align:left}
.chat-sugg button:hover{border-color:var(--lagoon);color:var(--lagoon-ink)}
.chat-form{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line);align-items:flex-end}
.chat-form textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:10px 12px;max-height:120px;min-height:44px;background:var(--surface);font-size:.95rem}
.chat-form textarea:focus{outline:none;border-color:var(--lagoon);box-shadow:0 0 0 3px var(--shallow)}
.chat-send{width:44px;height:44px;border-radius:50%;border:0;background:var(--lagoon);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.chat-send:disabled{opacity:.4;cursor:not-allowed}
.chat-foot{font-size:.72rem;color:var(--ink-3);text-align:center;padding:0 12px 10px}
@media (max-width:520px){
  .chat-panel{right:0;bottom:0;width:100%;height:100%;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .chat-fab .lbl{display:none}
  .chat-fab{padding:8px}
}
@media print{.chat-fab,.chat-panel{display:none}}
/* ============ GUEST PROFILE ============ */
.pf-head{display:flex;gap:18px;align-items:center;background:linear-gradient(180deg,var(--sky1),var(--surface));border:1px solid var(--line);border-radius:22px;padding:22px 24px;margin-bottom:22px;flex-wrap:wrap}
.pf-av{width:64px;height:64px;border-radius:50%;background:var(--lagoon);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.35rem;flex:0 0 auto}
.pf-stats{display:flex;gap:10px;flex-wrap:wrap}
.pf-stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:104px}
.pf-stats b{display:block;font-size:1.15rem}
.pf-stats span{font-size:.78rem;color:var(--ink-2)}
.pf-layout{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
.pf-tabs{display:flex;flex-direction:column;gap:4px;position:sticky;top:90px}
.pf-tabs button{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;text-align:left;padding:11px 14px;border-radius:12px;font-weight:600;color:var(--ink-2)}
.pf-tabs button:hover{background:var(--surface-2);color:var(--ink)}
.pf-tabs button.on{background:var(--shallow);color:var(--lagoon-ink)}
.pf-count{font-size:.75rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink-2)}
.pf-body{min-width:0}
.pf-sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pf-sec-head h2{font-size:1.4rem}
.pf-bk{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.pf-ic{width:44px;height:44px;border-radius:12px;background:var(--surface-2);color:var(--lagoon-ink);display:grid;place-items:center}
.pf-ic svg{width:22px;height:22px}
.pf-bk .end{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pf-card{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--surface);flex-wrap:wrap}
.pf-cardart{width:56px;height:38px;border-radius:7px;background:linear-gradient(135deg,#12293A,#2c4a5e);color:#fff;font-size:.62rem;font-weight:700;display:flex;align-items:flex-end;padding:4px 6px;flex:0 0 auto}
.pf-addcard{border:1px dashed var(--line);border-radius:14px;padding:16px;margin-top:4px}
.pf-meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pf-meter i{display:block;height:100%;width:0;transition:width .2s}
.pf-rules{list-style:none;padding:0;margin:8px 0 0;font-size:.82rem;color:var(--ink-2)}
.pf-rules li::before{content:"\25CB  "}
.pf-rules li.ok{color:var(--ok)}
.pf-rules li.ok::before{content:"\2713  "}
.pw-wrap{position:relative;display:block}
.pw-wrap .input{padding-right:64px}
.pw-wrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--lagoon-ink);font-weight:600;font-size:.82rem;padding:6px}
@media (max-width:820px){.pf-layout{grid-template-columns:1fr}.pf-tabs{flex-direction:row;overflow-x:auto;position:static}.pf-tabs button{flex:0 0 auto}.pf-bk{grid-template-columns:1fr}.pf-ic{display:none}.pf-bk .end{align-items:flex-start}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
